  <circle cx="16" cy="14" r="4" fill="#A855F7"/>
  <circle cx="28" cy="14" r="4" fill="#3B0764"/>
  <circle cx="40" cy="14" r="4" fill="#1E1B2E"/>
  <text x="56" y="17" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">ROOT-ME // OFFENSIVE TELEMETRY &amp; REVERSING LAB</text>
  <text x="804" y="17" text-anchor="end" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10">STATUS: VERIFIED</text>
  <line x1="1" y1="26" x2="819" y2="26" stroke="#2E1065" stroke-width="1"/>

  <!-- Metric 1: Points -->
  <text x="32" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">TOTAL SCORE</text>
  <text x="32" y="92" fill="url(#purpleText)" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800">645</text>
  <text x="110" y="90" fill="#7C3AED" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">PTS</text>

  <!-- Metric Divider 1 -->
  <line x1="190" y1="40" x2="190" y2="132" stroke="#2E1065" stroke-width="1"/>

  <!-- Metric 2: Solved Challenges -->
  <text x="216" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">CHALLENGES SOLVED</text>
  <text x="216" y="92" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800">9</text>
  <text x="248" y="90" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">FLAGS</text>

  <!-- Metric Divider 2 -->
  <line x1="390" y1="40" x2="390" y2="132" stroke="#2E1065" stroke-width="1"/>

  <!-- Metric 3: Payload Density -->
  <text x="416" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">PAYLOAD DENSITY</text>
  <text x="416" y="92" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800">~71.7</text>
  <text x="542" y="90" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">PTS / FLAG</text>

