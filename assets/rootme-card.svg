<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090611"/>
      <stop offset="0.5" stop-color="#0E0A1A"/>
      <stop offset="1" stop-color="#07050C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="820" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="purpleText" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#A855F7"/>
