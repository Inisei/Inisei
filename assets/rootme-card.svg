  <rect x="32" y="108" width="756" height="26" rx="4" fill="#150E28" stroke="#3B0764" stroke-width="0.8"/>
  <text x="44" y="125" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">⚡ ANOMALY METRIC:</text>
  <text x="175" y="125" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Standard 645 pts = 40+ entry challenges · Zero low-effort farming · Pure Hard / Insane focus</text>
